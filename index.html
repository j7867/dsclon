<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Discord Clone</title>
    <!-- ПОДКЛЮЧАЕМ СТИЛИ ИЗ ОТДЕЛЬНОГО ЧИСТОГО ФАЙЛА style.css -->
    <link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-firestore-compat.min.js"></script>

</head>
<body>

    <!-- 1. САМАЯ ЛЕВАЯ КОЛОНКА СЕРВЕРОВ (72px) -->
    <div class="guilds-sidebar" id="guildsSidebar">
        <!-- Иконка личных сообщений (ЛС) -->
        <div class="guild-icon active" id="dmServerBtn" data-type="dm">DM</div>
        <!-- Иконка общего сервера -->
        <div class="guild-icon" id="publicServerBtn" data-type="server">🌐</div>
        <!-- Плавающая кнопка создания сервера -->
        <div class="add-server-btn-sidebar" id="addServerBtnTrigger">+</div>
    </div>

    <!-- 2. СРЕДНЯЯ КОЛОНКА КАНАЛОВ И ПРОФИЛЯ (240px) -->
    <div class="channels-sidebar" id="channelsSidebar">
        <!-- Контейнер для Личных сообщений -->
        <div id="dmChannelsSection">
            <div class="sidebar-header">ЛИЧНЫЕ СООБЩЕНИЯ</div>
            <div class="channels-list" id="dmChannelsList"></div>
        </div>

        <!-- Контейнер для Общего сервера -->
        <div id="serverChannelsSection" style="display: none;">
            <div class="sidebar-header" style="display: flex; justify-content: space-between; align-items: center; padding-right: 8px;">
                <span>TEКСТОВЫЕ КАНАЛЫ</span>
                <span id="openCreateChannelBtn" style="cursor: pointer; font-size: 18px; transition: color 0.15s;" title="Создать канал">+</span>
            </div>
            <div id="serverChannelsList">
                <div class="custom-user-item active" data-channel="general-chat">
                    <div class="user-avatar" style="background-color: #5865f2;">#</div>
                    <span>general-chat</span>
                </div>
            </div>
        </div>

        <!-- ИСПРАВЛЕННЫЙ БЛОК ПРОФИЛЯ -->
        <div class="user-profile-block" style="margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 10px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <div class="user-avatar" id="openFullProfileBtn">U</div>
                <span class="user-name" id="userHeaderName" style="font-weight: 600; color: #fff;">User</span>
                <button id="goToAdminRequestsBtn" style="display: none; background: #383a40; border: none; color: #fff; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; margin-left: auto;">Админ</button>
            </div>
        </div>
    </div>
    <!-- 3. ЦЕНТРАЛЬНАЯ ШИРОКАЯ ОБЛАСТЬ ЧАТА -->
    <div class="chat-area" id="chatArea">
        <!-- Шапка чата -->
        <div class="chat-header">
            <div class="header-left">
                <span class="hashtag">#</span>
                <h3 id="chatTitle">general-chat</h3>
            </div>
            
            <!-- Исправленная шапка: Иконки на месте, текст User заменится на твой ник -->
            <div class="header-right-group">
                <span class="user-name-header" id="topUserName">User</span>
                <div class="user-avatar-header" id="userAvatarHeader" style="background-color: #5865f2; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; cursor: pointer;">U</div>
                
                <!-- Кнопка уведомлений (колокольчик вернулся наверх) -->
                <button id="notificationBell" class="notification-bell" title="Уведомления">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"></path></svg>
                </button>
                <!-- Кнопка настроек зон (шестеренка) -->
                <button id="openSettingsBtn" class="settings-gear-trigger" title="Настройки зон">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l-.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3-1.07-3-3s1.07-3 3-3 3 1.07 3 3-1.07 3-3 3z"></path></svg>
                </button>
            </div>
        </div>

        <!-- Парящее окно настроек -->
        <div class="settings-sidebar" id="settingsSidebar">
            <h2 class="modal-title">Настройки</h2>
            <div class="modal-screen active-screen" id="mainSettingsScreen">
                <button class="menu-nav-btn" id="goToZonesBtn">Настройка зон</button>
            </div>
            <div class="modal-screen" id="zoneSettingsScreen">
                <button class="back-menu-nav-btn" id="backToMenuBtn">← Назад</button>
                <div class="custom-select-container">
                    <div class="custom-select-trigger" id="zoneSelectTrigger">Выберите зону <span class="select-arrow">▼</span></div>
                    <div class="custom-select-options" id="zoneSelectOptions">
                        <div class="custom-option" data-value="chatArea">Central Chat</div>
                        <div class="custom-option" data-value="channelsSidebar">Channels Sidebar</div>
                        <div class="custom-option" data-value="guildsSidebar">Left Guilds Sidebar</div>
                        <div class="custom-option" data-value="settingsSidebar">Right Settings Sidebar</div>
                    </div>
                </div>
                <div class="color-picker-wrapper">
                    <input type="color" class="color-picker-input" id="customColorInput" value="#313338">
                    <div class="color-picker-circle" id="colorPreviewCircle"></div>
                </div>
                <button class="menu-nav-btn" id="applyColorBtn" style="margin-top: 20px; text-align: center;">Применить</button>
            </div>
        </div>

        <!-- Контейнер для сообщений чата -->
        <div class="messages-container" id="messagesContainer"></div>

        <!-- Зона ввода и плашка отмены -->
        <div class="input-area">
            <!-- Плашка подтверждения удаления в стиле Discord -->
            <div id="deleteConfirmPanel" class="delete-confirm-panel">
                <div class="delete-panel-content">
                    <span class="delete-panel-text">Вы точно хотите удалить сообщение?</span>
                    <div class="delete-panel-controls">
                        <button id="cancelDeleteBtn" class="delete-cancel-btn">Отмена</button>
                        <div class="countdown-wrapper">
                            <span id="countdownNumber" class="countdown-number">5</span>
                            <svg class="countdown-svg" width="24" height="24" viewBox="0 0 24 24">
                                <circle class="countdown-circle-bg" cx="12" cy="12" r="10"></circle>
                                <circle id="countdownCircle" class="countdown-circle" cx="12" cy="12" r="10"></circle>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Сама строка ввода сообщений -->
            <div class="input-wrapper">
                <input type="text" class="message-input" id="messageInput" placeholder="Send a message..." autocomplete="off">
                <button class="send-btn" id="sendBtn" title="Send">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"></path></svg>
                </button>
            </div>
        </div>
    </div> <!-- Закрываем chat-area -->
