<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Discord Clone</title>
    <!-- ПОДКЛЮЧАЕМ СТИЛИ ИЗ ОТДЕЛЬНОГО ЧИСТОГО ФАЙЛА style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. ПАНЕЛЬ С СЕРВЕРАМИ -->
  <div class="guilds-sidebar" id="guildsSidebar">
    <div class="guild-icon active">DM</div>
  </div>

  <!-- 2. ПАНЕЛЬ С КАНАЛАМИ -->
  <div class="channels-sidebar" id="channelsSidebar">
    <div class="sidebar-header">CHANNELS</div>
    <div class="user-item active">
      <div class="user-avatar" style="background-color: #5865f2;">*</div>
      <span>general-chat</span>
    </div>
  </div>

  <!-- 3. ЦЕНТРАЛЬНАЯ ОБЛАСТЬ ЧАТА -->
  <div class="chat-area" id="chatArea">
    <div class="chat-header"><span># general-chat</span></div>
    <div class="messages-container" id="messagesContainer"></div>
    <div class="input-area">
      <div class="input-wrapper">
        <input type="text" class="message-input" id="messageInput" placeholder="Send a message..." autocomplete="off">
        <button class="send-btn" id="sendBtn" title="Send">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </button>
      </div>
    </div>
  </div>
  <!-- КНОПКИ УПРАВЛЕНИЯ В ВЕРХНЕМ ПРАВОМ УГЛУ ЭКРАНА -->
  <button class="notification-bell" id="notificationBell" title="Уведомления">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1-1.5-1s-1.5.17-1.5 1v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      <div class="bell-badge" id="bellBadge"></div>
  </button>
  
  <button class="settings-gear-trigger" id="settingTrigger" title="Настройки">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
  </button>

  <!-- ВЫПАДАЮЩЕЕ СЕРОЕ МЕНЮ УВЕДОМЛЕНИЙ -->
  <div class="notifications-dropdown" id="notificationsDropdown">
      <div class="notif-empty" id="notifEmptyText">Уведомлений пока нет</div>
      <div id="notifList"></div>
  </div>
  <!-- ПАРЯЩЕЕ ОКНО НАСТРОЕК (КАК НА ТВОЕМ СКРИНЕ) -->
  <div class="settings-sidebar" id="settingsSidebar">
    <h2 class="modal-title">Настройки</h2>
    
    <div class="modal-screen active-screen" id="mainSettingsScreen">
        <button class="menu-nav-btn" id="goToZonesBtn">Настройка зон</button>
    </div>
    
    <div class="modal-screen" id="zoneSettingsScreen">
        <button class="back-menu-btn" id="backToMenuBtn">← Назад</button>
        <div class="custom-select-container">
            <div class="custom-select-trigger" id="zoneSelectTrigger">Выберите зону <span class="select-arrow">▼</span></div>
            <div class="custom-select-options" id="zoneSelectOptions">
                <div class="custom-option" data-value="chatArea">Central Chat</div>
                <div class="custom-option" data-value="channelsSidebar">Channels Sidebar</div>
                <div class="custom-option" data-value="guildsSidebar">Left Guilds Sidebar</div>
                <div class="custom-option" data-value="settingsSidebar">Right Settings Sidebar</div>
            </div>
        </div>
        <div class="color-picker-wrapper">
            <input type="color" class="color-picker-input" id="customColorInput" value="#313338">
            <div class="color-picker-circle" id="colorPreviewCircle"></div>
        </div>
        <button class="menu-nav-btn" id="applyColorBtn" style="margin-top: 20px; text-align: center;">Применить цвет</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
